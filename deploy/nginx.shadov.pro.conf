# /etc/nginx/sites-available/shadov.pro
# VPS завершает TLS и прозрачно проксирует приложение из Lovable Cloud.
# Локальный Node/PM2 и секреты backend на VPS не требуются.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# www -> non-www redirect
server {
    listen 80;
    listen [::]:80;
    server_name www.shadov.pro;
    return 301 https://shadov.pro$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name shadov.pro;

    # certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://shadov.pro$request_uri;
}

